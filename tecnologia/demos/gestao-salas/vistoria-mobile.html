<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vistoria de Sala | Gestão Salas</title>
    <meta name="theme-color" content="#0D9488">
    <script src="assets/libs/tailwindcss.js"></script>
    <script src="assets/js/tailwind_config.js"></script>
    <script src="assets/libs/lucide.js"></script>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/theme.css">
    <script>
        (function () {
            try {
                var pref = localStorage.getItem('salas_theme_preference');
                if (pref === 'dark' || !pref) document.documentElement.classList.add('dark');
            } catch (e) {}
        })();
    </script>
</head>
<body class="min-h-screen">
    <div class="max-w-lg mx-auto p-4 pb-24">

        <div id="vistoria-error" class="hidden text-center py-16">
            <i data-lucide="qr-code" class="w-10 h-10 mx-auto mb-3 text-muted opacity-50"></i>
            <p class="text-sm text-muted">Link inválido ou expirado. Peça para gerar um novo QR Code no sistema.</p>
        </div>

        <div id="vistoria-app" class="hidden">
            <div class="bg-surface p-5 rounded-2xl border border-border mb-4">
                <p class="text-xs uppercase text-muted mb-1">Vistoria de <span id="v-phase-label"></span></p>
                <h2 id="v-room-name" class="text-xl font-bold"></h2>
                <p id="v-tenant-name" class="text-sm text-muted mt-1"></p>
            </div>

            <form id="vistoria-form" class="space-y-3">
                <div id="vistoria-items-container" class="space-y-3"></div>

                <button type="submit" class="btn btn-primary w-full justify-center py-3 text-sm mt-4">
                    <i data-lucide="circle-check" class="w-4 h-4"></i>
                    <span>Finalizar Vistoria</span>
                </button>
            </form>

            <div id="vistoria-result" class="hidden mt-6 space-y-3">
                <div class="bg-surface p-5 rounded-2xl border border-border text-center">
                    <i data-lucide="circle-check-big" class="w-10 h-10 mx-auto mb-2 text-emerald-500"></i>
                    <p class="text-sm font-medium">Vistoria registrada!</p>
                    <p class="text-xs text-muted mt-1">Baixe o arquivo e envie para quem gerencia o sistema, ou compartilhe direto pelo WhatsApp.</p>
                </div>
                <button type="button" id="btn-download-vistoria" class="btn btn-secondary w-full justify-center py-2.5 text-sm">
                    <i data-lucide="download" class="w-4 h-4"></i>
                    <span>Baixar Arquivo (JSON)</span>
                </button>
                <button type="button" id="btn-share-vistoria" class="btn btn-primary w-full justify-center py-2.5 text-sm hidden">
                    <i data-lucide="share-2" class="w-4 h-4"></i>
                    <span>Compartilhar (WhatsApp e outros)</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Decodifica UTF-8 com segurança (acentos) a partir de base64
        function decodeBase64Json(str) {
            try {
                const json = decodeURIComponent(escape(atob(str)));
                return JSON.parse(json);
            } catch (e) {
                return null;
            }
        }

        function escapeHTML(str) {
            return String(str || '').replace(/[&<>"']/g, (match) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            })[match]);
        }

        let vistoriaData = null;
        let finalResultPayload = null;

        function init() {
            const params = new URLSearchParams(window.location.search);
            const raw = params.get('d');
            vistoriaData = raw ? decodeBase64Json(raw) : null;

            if (!vistoriaData || !vistoriaData.bookingId || !Array.isArray(vistoriaData.items) || vistoriaData.items.length === 0) {
                document.getElementById('vistoria-error').classList.remove('hidden');
                if (window.lucide) lucide.createIcons();
                return;
            }

            document.getElementById('vistoria-app').classList.remove('hidden');
            document.getElementById('v-phase-label').textContent = vistoriaData.phase === 'checkout' ? 'Saída' : 'Entrada';
            document.getElementById('v-room-name').textContent = vistoriaData.roomName || 'Sala';
            document.getElementById('v-tenant-name').textContent = vistoriaData.tenantName || '';

            const container = document.getElementById('vistoria-items-container');
            container.innerHTML = vistoriaData.items.map((item, index) => `
                <div class="p-4 rounded-xl border border-border bg-elevated space-y-2" data-vistoria-item data-item-index="${index}">
                    <p class="text-sm font-medium text-main">${escapeHTML(item)}</p>
                    <label class="flex items-center gap-2 text-sm cursor-pointer">
                        <input type="checkbox" data-vistoria-ok class="rounded w-4 h-4" checked>
                        <span>Conferido sem problema</span>
                    </label>
                    <input type="text" data-vistoria-note class="w-full p-2.5 text-sm" placeholder="Observação (opcional)">
                </div>
            `).join('');

            if (window.lucide) lucide.createIcons();
        }

        document.getElementById('vistoria-form').addEventListener('submit', function (e) {
            e.preventDefault();

            const items = Array.from(document.querySelectorAll('[data-vistoria-item]')).map(row => {
                const index = Number(row.dataset.itemIndex);
                return {
                    text: vistoriaData.items[index],
                    ok: row.querySelector('[data-vistoria-ok]').checked,
                    note: row.querySelector('[data-vistoria-note]').value.trim()
                };
            });

            finalResultPayload = {
                bookingId: vistoriaData.bookingId,
                type: vistoriaData.phase === 'checkout' ? 'checkout' : 'checkin',
                roomName: vistoriaData.roomName,
                tenantName: vistoriaData.tenantName,
                items,
                by: 'Vistoria Mobile (QR Code)',
                at: new Date().toISOString()
            };

            document.getElementById('vistoria-form').classList.add('hidden');
            document.getElementById('vistoria-result').classList.remove('hidden');

            try {
                if (navigator.canShare && navigator.canShare({ files: [new File([''], 'test.json')] })) {
                    document.getElementById('btn-share-vistoria').classList.remove('hidden');
                }
            } catch (e) {}

            if (window.lucide) lucide.createIcons();
        });

        document.getElementById('btn-download-vistoria').addEventListener('click', function () {
            const blob = new Blob([JSON.stringify(finalResultPayload, null, 2)], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `vistoria_${finalResultPayload.bookingId}_${finalResultPayload.type}.json`;
            link.click();
        });

        document.getElementById('btn-share-vistoria').addEventListener('click', async function () {
            try {
                const blob = new Blob([JSON.stringify(finalResultPayload, null, 2)], { type: 'application/json' });
                const file = new File([blob], `vistoria_${finalResultPayload.bookingId}_${finalResultPayload.type}.json`, { type: 'application/json' });
                await navigator.share({
                    files: [file],
                    title: 'Vistoria de Sala',
                    text: `Vistoria de ${finalResultPayload.type === 'checkout' ? 'saída' : 'entrada'} — ${finalResultPayload.roomName}`
                });
            } catch (e) {
                // Usuário cancelou o compartilhamento ou navegador não suporta — sem ação necessária
            }
        });

        init();
    </script>
</body>
</html>
