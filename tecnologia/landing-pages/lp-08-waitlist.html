<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Espera | V3.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #000000; color: #ffffff; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .bg-gradient { position: absolute; width: 80vw; height: 80vw; top: 50%; left: 50%; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, rgba(0,0,0,0) 70%); z-index: -1; pointer-events: none; }
    .form-input { background: transparent; border: 0; border-bottom: 2px solid #3f3f46; color: white; padding: 1rem 0; font-size: 1.5rem; outline: none; transition: border-color 0.3s; width: 100%; border-radius: 0; }
    .form-input:focus { border-color: #8b5cf6; }
    .form-input::placeholder { color: #52525b; }
    .btn-submit { background: white; color: black; font-weight: 900; border-radius: 999px; padding: 1rem 2rem; cursor: pointer; transition: transform 0.2s; white-space: nowrap; }
    .btn-submit:hover { transform: scale(1.05); }
  </style>
</head>
<body class="antialiased items-center justify-center relative">
  <div class="bg-gradient"></div>

  <div class="max-w-2xl w-full px-8 text-center">
    <div class="mb-4 inline-block border border-white/20 rounded-full px-4 py-1 text-xs font-bold uppercase tracking-widest text-zinc-400">
      Private Beta
    </div>
    
    <h1 class="text-5xl md:text-7xl font-black mb-6 tracking-tighter leading-none">
      A próxima geração <br/> está quase aqui.
    </h1>
    
    <p class="text-zinc-400 text-lg md:text-xl font-light mb-12">
      Seja um dos primeiros a experimentar a inteligência artificial que vai reescrever as regras da gestão de negócios. Vagas limitadas.
    </p>

    <form class="flex flex-col sm:flex-row gap-6 items-end max-w-lg mx-auto">
      <div class="flex-1 w-full relative">
        <input type="email" class="form-input" placeholder="Seu melhor e-mail" required>
      </div>
      <button type="submit" class="btn-submit w-full sm:w-auto">Entrar na Fila</button>
    </form>
    
    <p class="mt-8 text-sm text-zinc-500 font-bold">14,239 pessoas já estão na lista.</p>
  </div>
</body>
</html>
