<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Espera | V3.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #000000; color: #ffffff; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .bg-gradient { position: absolute; width: 80vw; height: 80vw; top: 50%; left: 50%; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, rgba(0,0,0,0) 70%); z-index: -1; pointer-events: none; }
    .form-input { background: transparent; border: 0; border-bottom: 2px solid #3f3f46; color: white; padding: 1rem 0; font-size: 1.5rem; outline: none; transition: border-color 0.3s; width: 100%; border-radius: 0; }
    .form-input:focus { border-color: #8b5cf6; }
    .form-input::placeholder { color: #52525b; }
    .btn-submit { background: white; color: black; font-weight: 900; border-radius: 999px; padding: 1rem 2rem; cursor: pointer; transition: transform 0.2s; white-space: nowrap; border: none; }
    .btn-submit:hover:not(:disabled) { transform: scale(1.05); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .form-input.error { border-color: #ef4444; }

    /* Success */
    #form-area, #success-area { transition: opacity 0.3s ease; }
    #success-area { display: none; }
    #success-area.show { display: block; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-up { animation: fadeUp 0.45s cubic-bezier(0.16,1,0.3,1) forwards; }

    @keyframes countUp { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    .count-pop { animation: countUp 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards; }
  </style>
</head>
<body class="antialiased items-center justify-center relative">
  <div class="bg-gradient"></div>

  <div class="max-w-2xl w-full px-8 text-center">
    <div class="mb-4 inline-block border border-white/20 rounded-full px-4 py-1 text-xs font-bold uppercase tracking-widest text-zinc-400">
      Private Beta
    </div>

    <!-- ── Área do formulário ── -->
    <div id="form-area">
      <h1 class="text
