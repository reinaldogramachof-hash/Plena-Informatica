<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendar Demonstração | SaaSPro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; color: #111827; }

    .calendar-card {
      background: white; border: 1px solid #e5e7eb; border-radius: 1rem;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
      overflow: hidden;
    }

    /* ── Calendar day cells ── */
    .cal-day {
      aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      border-radius: 999px; font-size: 0.875rem; font-weight: 500;
      cursor: pointer; transition: background 0.15s, color 0.15s;
      border: none; background: transparent;
    }
    .cal-day:hover:not(:disabled):not(.selected) { background: #eff6ff; color: #2563eb; }
    .cal-day.today { border: 2px solid #93c5fd; color: #2563eb; font-weight: 700; }
    .cal-day.selected { background: #3b82f6; color: white; font-weight: 700; }
    .cal-day.selected.today { border-color: #1d4ed8; }
    .cal-day:disabled { color: #d1d5db; cursor: not-allowed; }

    /* ── Time slots ── */
    .time-slot {
      border: 1.5px solid #3b82f6; color: #3b82f6; text-align: center;
      padding: 0.65rem 0.5rem; border-radius: 0.5rem; font-weight: 600;
      font-size: 0.875rem; cursor: pointer; transition: all 0.15s;
      background: white; width: 100%;
    }
    .time-slot:hover { background: #eff6ff; }
    .time-slot.selected { background: #3b82f6; color: white; }

    /* ── Form inputs ── */
    .form-input {
      width: 100%; border: 1.5px solid #e5e7eb; border-radius: 0.5rem;
      padding: 0.75rem 1rem; font-size: 0.9375rem; color: #111827;
      transition: border-color 0.15s, box-shadow 0.15s; font-family: 'Inter', sans-serif;
    }
    .form-input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
    .form-input.error { border-color: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,0.1); }

    /* ── Buttons ── */
    .btn-primary {
      background: #3b82f6; color: white; font-weight: 700; font-size: 1rem;
      padding: 0.875rem 2rem; border-radius: 0.5rem; border: none; cursor: pointer;
      transition: background 0.15s, transform 0.1s; display: inline-flex; align-items: center; gap: 0.5rem;
    }
    .btn-primary:hover { background: #2563eb; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    /* ── Step transitions ── */
    .panel { display: none; }
    .panel.active { display: flex; flex-direction: column; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(12px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .animate-in { animation: slideIn 0.3s cubic-bezier(0.16,1,0.3,1) forwards; }

    /* ── Progress steps ── */
    .step-dot { width: 2rem; height: 2rem; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; }
    .step-dot.done { background: #3b82f6; color: white; }
    .step-dot.active { background: #3b82f6; color: white; box-shadow: 0 0 0 4px rgba(59,130,246,0.2); }
    .step-dot.pending { background: #e5e7eb; color: #9ca3af; }
    .step-line { flex: 1; height: 2px; background: #e5e7eb; }
    .step-line.done { background: #3b82f6; }

    /* ── Sidebar selected summary ── */
    #sidebar-selection { display: none; }
    #sidebar-selection.show { display: block; }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

  <header class="w-full p-6 text-center">
    <div class="font-bold text-xl tracking-tight">SaaS<span class="text-blue-500">Pro</span></div>
  </header>

  <main class="flex-1 max-w-5xl mx-auto px-4 py-8 w-full">

    <div class="text-center mb-8">
      <h1 class="text-3xl md:text-4xl font-black mb-3">Veja o SaaSPro em ação</h1>
      <p class="text-gray-500 text-base max-w-xl mx-auto">Agende um bate-papo de 30 minutos com nossos especialistas. Sem compromisso, totalmente focado no seu desafio.</p>
    </div>

    <!-- Progress indicator -->
    <div class="flex items-center justify-center max-w-xs mx-auto mb-8" id="progress-bar">
      <div class="flex flex-col items-center gap-1">
        <div class="step-dot active" id="dot-1">1</div>
        <span class="text-xs text-gray-500 font-medium">Data</span>
      </div>
      <div class="step-line" id="line-1"></div>
      <div class="flex flex-col items-center gap-1">
        <div class="step-dot pending" id="dot-2">2</div>
        <span class="text-xs text-gray-500 font-medium">Dados</span>
      </div>
      <div class="step-line" id="line-2"></div>
      <div class="flex flex-col items-center gap-1">
        <div class="step-dot pending" id="dot-3"><i class="ph-bold ph-check text-xs"></i></div>
        <span class="text-xs text-gray-500 font-medium">Confirmado</span>
      </div>
    </div>

    <!-- Main card -->
    <div class="calendar-card flex flex-col md:flex-row max-w-4xl mx-auto">

      <!-- ── Left sidebar: event details ── -->
      <div class="p-6 md:w-72 shrink-0 bg-gray-50 border-b md:border-b-0 md:border-r border-gray-200 flex flex-col gap-5">
        <div class="w-14 h-14 rounded-full bg-blue-100 flex items-center justify-center text
