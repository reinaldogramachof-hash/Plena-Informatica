<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Links | Plena Informática</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #fce7f3; /* Pink background */ background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%); background-attachment: fixed; color: #fff; }
    .link-card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); padding: 1.25rem; border-radius: 1rem; text-align: center; font-weight: 600; display: block; margin-bottom: 1rem; transition: all 0.2s; position: relative; overflow: hidden; }
    .link-card:hover { background: rgba(255, 255, 255, 0.2); transform: translateY(-2px); }
    .link-card.highlight { background: #fff; color: #000; }
    .link-card.highlight:hover { background: #f3f4f6; }
    .link-card:active { transform: scale(0.97); }

    /* Ripple */
    .ripple { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.35); transform: scale(0); animation: ripple-out 0.55s ease forwards; pointer-events: none; }
    @keyframes ripple-out { to { transform: scale(4); opacity: 0; } }

    /* Toast */
    #link-toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(4rem); background: rgba(255,255,255,0.15); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.2); color: white; font-weight: 600; font-size: 0.875rem; padding: 0.75rem 1.5rem; border-radius: 999px; z-index: 100; transition: transform 0.35s cubic-bezier(0.16,1,0.3,1); white-space: nowrap; }
    #link-toast.show { transform: translateX(-50%) translateY(0); }

    /* Contador de visitas */
    .visit-badge { display: inline-flex; align-items: center; gap: 0.4rem; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 999px; padding: 0.3rem 0.75rem; font-size: 0.7rem; color: rgba(255,255,255,0.5); font-weight: 600; }
  </style>
</head>
