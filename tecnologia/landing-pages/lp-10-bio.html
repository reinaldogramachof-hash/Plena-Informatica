<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Links | Plena Informática</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #fce7f3; /* Pink background */ background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%); background-attachment: fixed; color: #fff; }
    .link-card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); padding: 1.25rem; border-radius: 1rem; text-align: center; font-weight: 600; display: block; margin-bottom: 1rem; transition: all 0.2s; position: relative; overflow: hidden; }
    .link-card:hover { background: rgba(255, 255, 255, 0.2); transform: translateY(-2px); }
    .link-card.highlight { background: #fff; color: #000; }
    .link-card.highlight:hover { background: #f3f4f6; }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center py-12 px-5">
  
  <div class="w-full max-w-sm mx-auto flex flex-col items-center">
    <!-- Perfil -->
    <img src="https://i.pravatar.cc/150?img=12" alt="Perfil" class="w-24 h-24 rounded-full border-4 border-white/20 mb-4 shadow-xl">
    <h1 class="text-2xl font-bold mb-1">Plena Informática</h1>
    <p class="text-white/70 text-sm mb-8 text-center">Transformando código em conversão. Desenvolvedores & Marqueteiros.</p>

    <!-- Links -->
    <div class="w-full w-full">
      <a href="#" class="link-card highlight flex justify-center items-center gap-3 shadow-[0_0_20px_rgba(255,255,255,0.3)]">
        <i class="ph-bold ph-calendar-plus text-xl"></i> Agendar Consultoria Grátis
      </a>
      
      <a href="#" class="link-card flex justify-center items-center gap-3">
        <i class="ph-bold ph-globe text-xl"></i> Site Oficial
      </a>
      
      <a href="#" class="link-card flex justify-center items-center gap-3">
        <i class="ph-bold ph-whatsapp-logo text-xl"></i> Atendimento via WhatsApp
      </a>
      
      <a href="#" class="link-card flex justify-center items-center gap-3">
        <i class="ph-bold ph-book-open text-xl"></i> Baixar E-book: Microsserviços
      </a>
      
      <a href="#" class="link-card flex justify-center items-center gap-3">
        <i class="ph-bold ph-youtube-logo text-xl"></i> Canal no YouTube
      </a>
    </div>

    <!-- Redes Sociais Rodapé -->
    <div class="flex gap-6 mt-8 text-white/50 text-2xl">
      <a href="#" class="hover:text-white transition-colors"><i class="ph-fill ph-instagram-logo"></i></a>
      <a href="#" class="hover:text-white transition-colors"><i class="ph-fill ph-tiktok-logo"></i></a>
      <a href="#" class="hover:text-white transition-colors"><i class="ph-fill ph-linkedin-logo"></i></a>
    </div>
  </div>

</body>
</html>
