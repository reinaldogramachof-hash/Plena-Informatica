<head>
  <meta charset="UTF-8">

  <link rel="canonical" href="https://plenainformatica.com.br/produtos/gestao-gastro">
  <meta property="og:title" content="Gestão Gastro | Plena Informática">
  <meta property="og:description" content="Plataforma SaaS para bares e restaurantes com 20+ módulos. Demo gratuita disponível.">

  <style>
    /* ── Mockup animado ── */
    @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    @keyframes blink  { 0%,100%{opacity:1} 50%{opacity:.25} }

    .mockup-shell {
      background:#0e0e10; border:1px solid rgba(255,255,255,.08);
      border-radius:14px; overflow:hidden; font-family:Inter,sans-serif;
      animation:fadeUp .6s ease both;
    }
    .mkbar {
      background:#16161a; border-bottom:1px solid rgba(255,255,255,.06);
      padding:9px 14px; display:flex; align-items:center; gap:7px;
    }
    .mkdot { width:9px;height:9px;border-radius:50%; }
    .mktitle { font-size:10px;color:#666;letter-spacing:.07em;margin-left:4px;flex:1 }
    .mkbadge { font-size:9px;padding:2px 7px;border-radius:3px;background:rgba(224,123,74,.12);color:#E07B4A;border:1px solid rgba(224,123,74,.25); }
    .mkbody  { display:flex;height:230px; }
    .mksidebar {
      width:44px;background:#111113;border-right:1px solid rgba(255,255,255,.05);
      display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:12px;
    }
    .mksidebar i { font-size:16px;color:#444; }
    .mksidebar i.on { color:#E07B4A; }
    .mkcontent { flex:1;padding:12px;overflow:hidden; }
    .mkgrid { display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px; }
    .mkkpi {
      background:#1a1a1d;border:1px solid rgba(255,255,255,.06);border-radius:7px;
      padding:7px 9px;animation:fadeUp .5s ease both;
    }
    .mkkpi:nth-child(2){animation-delay:.08s}.mkkpi:nth-child(3){animation-delay:.16s}
    .mkkpi-l { font-size:8px;color:#555;text-transform:uppercase;letter-spacing:.05em; }
    .mkkpi-v { font-size:14px;font-weight:700;color:#fff;margin-top:1px; }
    .mkkpi-v.g{color:#4ade80}.mkkpi-v.a{color:#E07B4A}
    .mklabel { font-size:9px;color:#555;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px; }
    .mktables { display:grid;grid-template-columns:repeat(5,1fr);gap:4px; }
    .mkt {
      aspect-ratio:1;border-radius:5px;border:1px solid rgba(255,255,255,.06);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      font-size:8px;font-weight:600;animation:fadeUp .4s ease both;
    }
    .mkt.livre { background:#1c1c1f;color:#555; }
    .mkt.ocupada { background:rgba(224,123,74,.12);border-color:rgba(224,123,74,.3);color:#E07B4A; }
    .mkt .dot { width:4px;height:4px;border-radius:50%;background:currentColor;margin-bottom:2px;animation:blink 2s ease infinite; }
    .mkt.livre .dot { animation:none; }

    /* ── Módulos ── */
    .mod-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px; }
    .mod-item {
      display:flex;align-items:flex-start;gap:9px;
      background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);
      border-radius:9px;padding:13px;transition:border-color .2s;
    }
    .mod-item:hover { border-color:rgba(224,123,74,.35); }
    .mod-item i { font-size:20px;color:#E07B4A;flex-shrink:0;margin-top:1px; }
